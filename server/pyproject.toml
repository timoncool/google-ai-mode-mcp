[project]
name = "google-ai-mode-mcp"
version = "0.3.0"
description = "Google AI Mode as an MCP server: AI answers with citations from your own browser, no API keys"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Nerual Dreming (timoncool)" },
    { name = "Bala Kumar", email = "mail@balakumar.dev" },
]
keywords = ["mcp", "google", "ai-mode", "ai-overview", "search", "chrome-extension", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "mcp>=1.0.0,<2",
    "httpx>=0.28.0",
]

[project.scripts]
google-ai-mode-mcp = "google_ai_scraper.mcp_server.server:main"
google-ai-scraper = "google_ai_scraper.mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/timoncool/google-ai-mode-mcp"
Repository = "https://github.com/timoncool/google-ai-mode-mcp"
Issues = "https://github.com/timoncool/google-ai-mode-mcp/issues"
Upstream = "https://github.com/balakumardev/google-ai-scraper"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["google_ai_scraper"]

[tool.hatch.build.targets.wheel.force-include]
"../extension" = "google_ai_scraper/extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
